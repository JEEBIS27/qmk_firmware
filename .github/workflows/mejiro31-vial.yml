name: Mejiro31 Vial firmware
on:
  pull_request:
    paths:
      - 'keyboards/jeebis/mejiro31/**'
      - 'Makefile'
      - 'builddefs/build_keyboard.mk'
      - '.github/workflows/mejiro31-vial.yml'
      - '.github/workflows/lint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-venv
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 thumbv6m-none-eabi
      - name: Test engine refresh and build metadata
        run: python3 keyboards/jeebis/mejiro31/tests/test_build_vial.py
      - name: Prepare pinned Vial and latest engine sources
        run: python3 keyboards/jeebis/mejiro31/build_vial.py --prepare-only
      - name: Install QMK Python dependencies
        run: |
          python3 -m venv .build/vial-python
          .build/vial-python/bin/pip install qmk -r .build/mejiro31-vial/vial/requirements.txt
      - name: Ordinary QMK regression suite
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          ln -s "$PWD/.build/mejiro31-vial/Mejiro_Engine" ../Mejiro_Engine
          sh keyboards/jeebis/mejiro31/tests/run.sh
      - name: Host adapter and site protocol tests
        run: python3 keyboards/jeebis/mejiro31/tests/run_vial_tests.py --source-dir .build/mejiro31-vial/vial
      - name: Build the standard JP and EN targets as Vial firmware
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          export PATH="$PWD/.build/vial-python/bin:$PATH"
          make jeebis/mejiro31:jp_default
          qmk compile -kb jeebis/mejiro31 -km en_default
      - uses: actions/upload-artifact@v4
        with:
          name: mejiro31-vial-defaults
          path: .build/*.uf2*
          if-no-files-found: error
